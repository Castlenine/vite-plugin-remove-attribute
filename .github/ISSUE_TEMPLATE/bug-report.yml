name: Bug Report
description: Report a bug in @castlenine/vite-plugin-remove-attribute
title: '[Bug]: '
labels: ['bug']
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Add the plugin to `vite.config.ts` with options...
        2. Create a file containing the attribute...
        3. Run `vite build` (or `vite dev`)...
        4. Observe the error...
    validations:
      required: true

  - type: textarea
    id: plugin-config
    attributes:
      label: Plugin Configuration
      description: The `removeAttribute({ ... })` options from your `vite.config.ts`.
      render: ts
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Logs, Screenshots or Recordings
      description: If applicable, add build logs, screenshots or recordings to help explain the issue.
    validations:
      required: false

  - type: input
    id: plugin-version
    attributes:
      label: Plugin Version
      description: The version of `@castlenine/vite-plugin-remove-attribute` you are using.
      placeholder: '2.0.2'
    validations:
      required: true

  - type: input
    id: vite-version
    attributes:
      label: Vite Version
      description: 'Run `npx vite -v` or check your `package.json`.'
      placeholder: '7.1.0'
    validations:
      required: true

  - type: dropdown
    id: framework
    attributes:
      label: Framework
      options:
        - Svelte / SvelteKit
        - Vue.js
        - React
        - Other
    validations:
      required: false

  - type: input
    id: framework-version
    attributes:
      label: Framework Version
      description: If applicable, the framework version from your `package.json`.
    validations:
      required: false

  - type: input
    id: node-version
    attributes:
      label: Node.js Version
      description: 'Run `node -v` in your terminal.'
      placeholder: '24.18.0'
    validations:
      required: true

  - type: input
    id: package-manager
    attributes:
      label: Package Manager and Version
      description: 'Run `npm -v`, `pnpm -v`, or `yarn -v`.'
      placeholder: 'pnpm 12.4.2'
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS
        - Windows
        - Linux
        - Other
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context about the problem (e.g., related issues, error logs, console output).
    validations:
      required: false
